<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <title>校園講座報名</title>
</head>

<body>
    <header>
        <h1>2026 校園講座</h1>
    </header>
    <nav>
        <a href="https://webap.nkust.edu.tw/nkust/">高科大校務系統</a> 或是
        <a href="https://www.youtube.com/watch?v=_c2e1NcI3Sc">擊敗哈蘭德，贏得 10 萬美元</a>
    </nav>
    <main>
        <section>
            <h2>講座介紹</h2>
				<p>此講座歡迎自由參加，我們會給予參加講座的人100美元。</p>
        <img src="lecture.png" alt="umm">
		
            <h2>資訊</h2>
				<table border="1">
                <tr>
                <th>日期</th>
                <th>時間</th>
                <th>地點</th>
                </tr>
                <tr>
                <td>2026/2/29</td>
                <td>14:00 - 16:00</td>
                <td>第一間教室</td>
                </tr>
                <tr>
                <td>2026/13/01</td>
                <td>10:00 - 12:00</td>
                <td>第二間教室</td>
                </tr>
            </table>
        </section>

        <section>
            <h2>報名</h2>
            <form>
                <div>
                    <label for="Name">姓名：</label>
                    <input type="text" id="Name" name="Name" required>
                </div>
                <br>
                <div>
                    <label for="yourEmail">E-mail：</label>
                    <input type="email" id="yourEmail" name="yourEmail" required>
                </div>
                <br>
                <div>
                    <span>身分：</span>
                    <label><input type="radio" name="identity" value="學生" checked> 學生</label>
                    <label><input type="radio" name="identity" value="教師"> 教師</label>
                    <label><input type="radio" name="identity" value="校外人士"> 校外人士</label>
                </div>
                <br>
                <div>
                    <span>有興趣主題：</span>
                    <label><input type="checkbox" name="interest" value="AI"> AI</label>
                    <label><input type="checkbox" name="interest" value="資安"> 資安</label>
                    <label><input type="checkbox" name="interest" value="網頁設計"> 網頁設計</label>
                </div>
                <br>
                <div>
                    <label for="JDate">參加日期：</label>
                    <input type="date" id="JDate" name="JDate">
                </div>
                <br>
                <div>
                    <label for="Session">場次：</label>
                    <select id="Session" name="session">
					
                        <option value="morning">上午場</option>
                        <option value="afternoon">下午場</option>
                    </select>
                </div>
                <br>
                <div>
                    <label for="remarks">備註：</label><br>
                    <textarea id="remarks" name="remarks" rows="5" cols="30"></textarea>
                </div>
                <br>
                <div>
				
                    <input type="submit" value="提交">
                    <input type="reset" value="重設">
					
                </div>
            </form>
        </section>
    </main>
    <footer>
	
        <p>:0</p>
		
    </footer>	
<script src="/lib/enable.js" type="text/javascript"></script></body>
</html>
